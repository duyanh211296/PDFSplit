# Đặt file này tại:  .github/workflows/build.yml  trong repo GitHub
# Mỗi lần push (hoặc bấm "Run workflow") sẽ tự build .exe và .app, tải ở tab Actions > Artifacts.
name: Build PDF Tool

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: python -m pip install pypdf pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDFTool pdf_tool.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PDFTool pdf_tool.py
          ditto -c -k --keepParent dist/PDFTool.app dist/PDFTool-mac.zip

      - name: Upload Windows exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PDFTool-windows
          path: dist/PDFTool.exe

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PDFTool-mac
          path: dist/PDFTool-mac.zip
